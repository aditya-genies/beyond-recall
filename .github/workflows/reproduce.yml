name: Verify independent study
on:
  push:
    paths: ['study.py', 'test_study.py', 'run_one.py', 'compare_results.py', 'checks/*.py', '.github/workflows/**']
  pull_request:
    paths: ['study.py', 'test_study.py', 'run_one.py', 'compare_results.py', 'checks/*.py', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Record software versions
        run: python -c "import sys,sqlite3; print(sys.version); print('SQLite',sqlite3.sqlite_version)"
      - name: Run ten focused tests
        run: python -W error::ResourceWarning -m unittest -v test_study
      - name: Reproduce all 528 structural cases and five probes
        run: python study.py campaign --out ci-results --workers 2
      - name: Independently check states and event witnesses
        run: python checks/check_results.py --campaign ci-results --out ci-verification.json
      - name: Compare frozen aggregate outcomes
        run: python compare_results.py --candidate ci-results
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: independent-verification-python-${{ matrix.python }}
          path: |
            ci-results/frozen_spec.json
            ci-results/summary.json
            ci-results/cases.jsonl
            ci-results/boundary_probes.json
            ci-verification.json
          retention-days: 7
