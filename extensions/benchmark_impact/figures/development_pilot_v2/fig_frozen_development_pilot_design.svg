   <g id="text_19">
    <text style="font-size: 6.7px; font-family: 'DejaVu Serif', serif; text-anchor: start; fill: #303942" x="9.072" y="199.490953" transform="rotate(-0 9.072 199.490953)">Design inventory: 308 native process phases, including 84 scheduled post-effect / pre-ack exits; no completion claim.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.7px; font-family: 'DejaVu Serif', serif; text-anchor: start; fill: #303942" x="9.072" y="209.426953" transform="rotate(-0 9.072 209.426953)">Authored grader calibration: 12/12 task labels agree; 2 current-conflict mismatches retained. Task outcomes remain provisional.</text>
