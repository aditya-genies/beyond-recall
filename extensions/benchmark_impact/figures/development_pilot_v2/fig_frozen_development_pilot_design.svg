   <g id="text_1">
    <text style="font-weight: 700; font-size: 11.2px; font-family: 'DejaVu Serif', serif; text-anchor: start; fill: #303942" x="9.072" y="16.07025" transform="rotate(-0 9.072 16.07025)">Frozen development pilot: public-history recovery and readers</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.1px; font-family: 'DejaVu Serif', serif; text-anchor: start; fill: #303942" x="9.072" y="27.642891" transform="rotate(-0 9.072 27.642891)">24 questions / 14 scopes / 2 local backends / 7 reader arms; not held-out confirmation</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(21.362234 66.755328)">History-only</text>
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(35.7905 74.947937)">input</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(16.796625 96.491555)">14 source scopes</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(18.922148 105.232992)">2 LoCoMo conv.</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(10.738102 112.637555)">12 LME components</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(17.889305 120.722414)">no gold or query</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(113.779422 66.807937)">Native provision</text>
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(123.210375 74.895328)">and cloning</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(115.217203 97.220906)">Mem0 infer=False</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(109.834125 104.625469)">LlamaIndex persisted</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(122.480531 113.366906)">real local BGE</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(108.212086 121.439906)">closed baseline cloned</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(224.635297 66.755328)">Retry + admission</text>
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(245.802188 75.664812)">variants</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(228.711469 96.866742)">native / event / text</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(232.158234 104.625469)">post-effect exit87</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(224.274984 112.649414)">before ack, then retry</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(221.05193 121.356891)">same event IDs + times</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(344.095047 67.524812)">Fixed context</text>
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(351.88875 75.664812)">+ readers</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(347.478023 97.220906)">60 candidates</text>
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(338.995875 105.293906)">at most 10 records</text>
