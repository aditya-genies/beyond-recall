   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; text-anchor: middle; fill: #303942" x="367.92" y="148.887938" transform="rotate(-0 367.92 148.887938)">Paired task comparisons: seven arms</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(269.655375 158.576414)">clean; retry; event guard; text guard; read-event dedup;</text>
