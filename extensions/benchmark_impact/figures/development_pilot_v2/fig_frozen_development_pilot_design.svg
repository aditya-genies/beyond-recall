    <text style="font-size: 6.7px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(329.393094 40.901953)">Question / date</text>
    <text style="font-size: 6.7px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(328.695875 48.064148)">query time only</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.7px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(423.348414 40.741781)">Gold labels; support</text>
    <text style="font-size: 6.7px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(414.350523 48.064148)">for oracle diagnostic only</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'DejaVu Serif', serif; text-anchor: middle; fill: #303942" x="117.432" y="148.887938" transform="rotate(-0 117.432 148.887938)">Separate state / context checks</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.9px; font-family: 'DejaVu Serif', serif; fill: #303942" transform="translate(61.130156 166.649414)">records; source-event coverage;</text>
